plugins {
    id 'fabric-loom' version '1.2-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extraProperties {
    properties {
        minecraft_version = project.property('minecraft_version')
        loader_version = project.property('loader_version')
        mod_version = project.property('mod_version')
        maven_group = project.property('maven_group')
        archives_base_name = project.property('archives_base_name')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_version}:v2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${loader_version}"
}

processResources {
    inputs.property "version", project.property('mod_version')
    inputs.property "minecraft_version", project.property('minecraft_version')
    inputs.property "loader_version", project.property('loader_version')
}

loom {
    run {
        version = project.property('minecraft_version')
        propertyMap {
            minecraftArguments = project.property('minecraftArguments')
            mainClass = 'net.fabricmc.devlaunchinjector.Main'
        }
    }
    ide {
        runDir = project.file('run')
    }
}